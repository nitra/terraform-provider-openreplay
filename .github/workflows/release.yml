name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Publish OpenTofu OCI mirror
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          repository="oci.7n.ai/opentofu-providers/nitra/openreplay"
          layout="$RUNNER_TEMP/openreplay-provider-oci"

          test -n "$REGISTRY_TOKEN"
          echo "$REGISTRY_TOKEN" | oras login oci.7n.ai -u "$GITHUB_ACTOR" --password-stdin

          cd dist
          oras push --artifact-type application/vnd.opentofu.provider-target --artifact-platform darwin/amd64 --oci-layout "$layout:darwin_amd64" "terraform-provider-openreplay_${version}_darwin_amd64.zip:archive/zip"
          oras push --artifact-type application/vnd.opentofu.provider-target --artifact-platform darwin/arm64 --oci-layout "$layout:darwin_arm64" "terraform-provider-openreplay_${version}_darwin_arm64.zip:archive/zip"
          oras push --artifact-type application/vnd.opentofu.provider-target --artifact-platform linux/amd64 --oci-layout "$layout:linux_amd64" "terraform-provider-openreplay_${version}_linux_amd64.zip:archive/zip"
          oras push --artifact-type application/vnd.opentofu.provider-target --artifact-platform linux/arm64 --oci-layout "$layout:linux_arm64" "terraform-provider-openreplay_${version}_linux_arm64.zip:archive/zip"
          oras push --artifact-type application/vnd.opentofu.provider-target --artifact-platform windows/amd64 --oci-layout "$layout:windows_amd64" "terraform-provider-openreplay_${version}_windows_amd64.zip:archive/zip"
          oras manifest index create --artifact-type application/vnd.opentofu.provider --oci-layout "$layout:${version}" darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64
          oras cp --from-oci-layout "$layout:${version}" "${repository}:${version}"
